services:
  ignition-local:
    image: inductiveautomation/ignition:8.3.8
    container_name: ignition-demo-local
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment: &ignition_environment
      ACCEPT_IGNITION_EULA: "${ACCEPT_IGNITION_EULA:-Y}"
      GATEWAY_ADMIN_USERNAME: "${GATEWAY_ADMIN_USERNAME:-admin}"
      GATEWAY_ADMIN_PASSWORD: "${GATEWAY_ADMIN_PASSWORD:?Set GATEWAY_ADMIN_PASSWORD in .env}"
      IGNITION_EDITION: "${IGNITION_EDITION:-standard}"
      DISABLE_QUICKSTART: "true"
      TZ: "${TZ:-Europe/Amsterdam}"
    command: -n ignition-demo-local -a localhost -h 8088 -s 8043
    volumes:
      - ignition-local-data:/usr/local/bin/ignition/data
      - ./projects:/usr/local/bin/ignition/data/projects
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/StatusPing | grep -q '\"state\":\"RUNNING\"'"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s

  ignition-production:
    image: inductiveautomation/ignition:8.3.8
    container_name: ignition-demo-production
    restart: unless-stopped
    ports:
      - "8090:8088"
    environment: *ignition_environment
    command: -n ignition-demo-production -a localhost -h 8090 -s 8044
    volumes:
      - ignition-production-data:/usr/local/bin/ignition/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/StatusPing | grep -q '\"state\":\"RUNNING\"'"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  ignition-local-data:
  ignition-production-data:
