name: Deploy production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ignition-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Ship to production Ignition Gateway
    # A GitHub-hosted runner cannot reach the Docker daemon on the trainer's
    # machine. This runner must have the `ignition-demo` label and Docker access.
    runs-on: [self-hosted, ignition-demo]
    environment: production
    env:
      IGNITION_CONTAINER: ${{ vars.IGNITION_CONTAINER || 'ignition-demo-production' }}
      IGNITION_URL: ${{ vars.IGNITION_URL || 'http://localhost:8090' }}
      IGNITION_API_KEY: ${{ secrets.IGNITION_API_KEY }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify prerequisites
        run: |
          set -euo pipefail
          command -v docker
          command -v curl
          test -n "$IGNITION_API_KEY"
          docker inspect "$IGNITION_CONTAINER" >/dev/null
          test "$(docker inspect -f '{{.State.Running}}' "$IGNITION_CONTAINER")" = true

      - name: Validate project JSON
        run: |
          python3 -m json.tool projects/demo-project/project.json >/dev/null
          find projects -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: Ship files, scan, and smoke-check
        run: bash scripts/deploy.sh
