name: Deploy production

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ignition-demo-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Ship to production Ignition Gateway
    # The short-lived github-runner Compose service registers itself with this
    # label and shares the Docker daemon with the production Gateway.
    runs-on: [self-hosted, ignition-demo]
    timeout-minutes: 10
    env:
      IGNITION_URL: http://ignition-production:8088
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate project JSON
        run: |
          python3 -m json.tool projects/demo-project/project.json >/dev/null
          find projects -name '*.json' -print0 | xargs -0 -n1 python3 -m json.tool >/dev/null

      - name: Ship files, scan, and smoke-check
        run: bash scripts/deploy.sh
